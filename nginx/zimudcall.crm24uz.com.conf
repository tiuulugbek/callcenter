# ==============================================================================
# Nginx Konfiguratsiyasi: zimudcall.crm24uz.com
# Fayl manzili: /etc/nginx/sites-available/zimudcall.crm24uz.com
# ==============================================================================

# 1. HTTP dan HTTPS ga avtomatik yo'naltirish
server {
    listen 80;
    listen [::]:80;
    server_name zimudcall.crm24uz.com;
    return 301 https://$host$request_uri;
}

# 2. Asosiy HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zimudcall.crm24uz.com;

    # SSL sertifikatlari
    ssl_certificate /etc/letsencrypt/live/zimudcall.crm24uz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zimudcall.crm24uz.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # Frontend (React dist)
    root /var/www/callcenter/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik kesh (tez ishlashi uchun)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Backend API endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (Real-time hodisalar va chatlar)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Backend to'g'ridan-to'g'ri marshrutlari (Webhooklar)
    location ~ ^/(auth|calls|chats|operators|settings) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Asterisk WebRTC WSS (Brauzer telefoni uchun)
    location /ws {
        proxy_pass http://127.0.0.1:8088/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}

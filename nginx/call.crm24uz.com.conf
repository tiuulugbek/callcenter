# ==============================================================================
# Nginx Konfiguratsiyasi: call.crm24uz.com
# Fayl manzili: /etc/nginx/sites-available/call.crm24uz.com
# ==============================================================================

# 1. HTTP dan HTTPS ga avtomatik redirect
server {
    listen 80;
    listen [::]:80;
    server_name call.crm24uz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Asosiy HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name call.crm24uz.com;

    # SSL sertifikatlari (Certbot o'rnatgandan keyin):
    ssl_certificate /etc/letsencrypt/live/call.crm24uz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/call.crm24uz.com/privkey.pem;

    # Xavfsiz SSL sozlamalari
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Maksimal yuklash hajmi (audio fayllar uchun)
    client_max_body_size 50M;

    # Frontend (React SPA)
    root /var/www/callcenter/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Statik fayllar (JS, CSS, rasm va shriftlar) uchun tezkor kesh
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Backend API endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket (Real-time qo'ng'iroqlar va chatlar uchun)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Backend bevosita marshrutlari (Webhook va modullar)
    location ~ ^/(auth|calls|chats|operators|settings) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Asterisk WebRTC WSS (Brauzer telefoni uchun, agar kerak bo'lsa)
    location /ws {
        proxy_pass http://127.0.0.1:8088/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Loglar
    access_log /var/log/nginx/call.crm24uz.com.access.log;
    error_log /var/log/nginx/call.crm24uz.com.error.log;
}
